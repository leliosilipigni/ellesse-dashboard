<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Ellesse CRM — Giro Visite</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0f19;--card:#151c2c;--card2:#1a2233;--border:#232c40;--txt:#e8edf5;--txt2:#9ba6b9;--txt3:#6b7a8c;--accent:#6ea8fe;--accent2:#8b7cff;--green:#3ddc97;--yellow:#f6c453;--red:#ff6b7a;--radius:18px;--shadow:0 4px 24px rgba(0,0,0,.3)}
body{font-family:system-ui,-apple-system,Inter,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:0 0 80px 0}
header{text-align:center;padding:24px 16px 12px;background:radial-gradient(ellipse at 50% 0%,rgba(110,168,254,.08),transparent 70%)}
header h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
header .sub{font-size:13px;color:var(--txt2);margin-top:3px}
header .badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(110,168,254,.12);color:var(--accent);border:1px solid rgba(110,168,254,.2)}
/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 14px;max-width:800px;margin:0 auto}
.kpi-box{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.kpi-box .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);font-weight:600;margin-bottom:3px}
.kpi-box .val{font-size:clamp(15px,3.5vw,22px);font-weight:800;letter-spacing:-.5px}
.kpi-box .note{font-size:8px;color:var(--txt3);margin-top:2px;line-height:1.2}
.kpi-box.highlight{background:linear-gradient(135deg,#0d2818,#1a3a2a);border-color:var(--green)}
.kpi-box.highlight .val{color:var(--green)}
.kpi-box.danger{background:linear-gradient(135deg,#2a0d0d,#3a1a1a);border-color:var(--red)}
.kpi-box.danger .val{color:var(--red)}
/* Sezioni */
section{padding:8px 14px 4px;max-width:800px;margin:0 auto}
.sec-title{font-size:15px;font-weight:700;letter-spacing:-.3px;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title .cnt{font-size:12px;font-weight:600;color:var(--txt3);background:var(--card);padding:2px 10px;border-radius:12px}
/* Card cliente */
.cliente-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.cliente-card:active{transform:scale(.98)}
.cliente-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cliente-card .nome{font-size:16px;font-weight:700}
.cliente-card .zona{font-size:12px;color:var(--txt2);margin-top:2px}
.cliente-card .mandanti{font-size:11px;color:var(--txt3);margin-top:3px}
.cliente-card .badge-visite{font-size:11px;color:var(--accent);margin-top:4px}
.cliente-card .status{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cliente-card .pill{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600}
.pill.green{background:rgba(61,220,151,.12);color:var(--green);border:1px solid rgba(61,220,151,.2)}
.pill.yellow{background:rgba(246,196,83,.12);color:var(--yellow);border:1px solid rgba(246,196,83,.2)}
.pill.red{background:rgba(255,107,122,.12);color:var(--red);border:1px solid rgba(255,107,122,.2)}
.pill.gray{background:rgba(107,122,140,.12);color:var(--txt3);border:1px solid rgba(107,122,140,.2)}
.pill.blue{background:rgba(110,168,254,.12);color:var(--accent);border:1px solid rgba(110,168,254,.2)}
.cliente-card .azioni{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cliente-card .btn{flex:1;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;border:none;cursor:pointer;text-align:center;transition:all .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card);color:var(--txt2);border:1px solid var(--border)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-add{background:var(--green);color:#000;font-weight:700}
/* Intestazione azienda */
.azienda-group{margin-bottom:18px}
.azienda-header{display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:2px solid var(--border);margin-bottom:12px}
.azienda-header .azienda-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.azienda-header .azienda-nome{font-size:16px;font-weight:700}
.azienda-header .azienda-count{font-size:12px;color:var(--txt3);background:var(--card);padding:2px 10px;border-radius:12px}
/* Dettaglio cliente */
#detail-view{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:0 0 100px}
#detail-view.show{display:block}
.detail-header{position:sticky;top:0;background:var(--bg);padding:16px 14px 10px;z-index:10;border-bottom:1px solid var(--border)}
.detail-header .back{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}
.detail-header h2{font-size:20px;margin-top:4px}
.detail-header .info{font-size:13px;color:var(--txt2);margin-top:3px}
.detail-body{padding:14px}
.cliente-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.metric-card .m-val{font-size:18px;font-weight:800}
.metric-card .m-lbl{font-size:9px;text-transform:uppercase;color:var(--txt3);font-weight:600;margin-top:2px}
.metric-card .m-note{font-size:9px;color:var(--txt3);margin-top:1px}
.incontro-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.incontro-card .data{font-size:11px;color:var(--txt3);font-weight:600;display:flex;justify-content:space-between}
.incontro-card .gap{font-size:10px;color:var(--accent)}
.incontro-card .arg{font-size:13px;margin-top:6px;color:var(--txt)}
.incontro-card .dec{font-size:12px;margin-top:4px;color:var(--accent)}
.incontro-card .prossimi{font-size:12px;margin-top:4px;color:var(--green)}
/* Form */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px 30px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-content h3{font-size:18px;margin-bottom:14px}
.modal-content label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:4px;margin-top:12px}
.modal-content input,.modal-content textarea,.modal-content select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:14px;font-family:inherit}
.modal-content textarea{resize:vertical;min-height:70px}
.modal-content .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-content .btn{width:100%;margin-top:16px;padding:12px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer}
/* Filtri */
.filtri{display:flex;gap:8px;padding:4px 0 10px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.filtri .f-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--txt2);cursor:pointer;transition:all .12s;flex-shrink:0}
.filtri .f-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:14px;margin-bottom:8px}
.search-box::placeholder{color:var(--txt3)}
.empty-state{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty-state .emoji{font-size:48px;margin-bottom:12px}
/* Tabs dettaglio */
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:4px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--txt3);cursor:pointer;flex-shrink:0}
.tab.active{background:var(--card);color:var(--accent);border-bottom:2px solid var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
/* Responsive */
@media(max-width:560px){.kpi-strip{grid-template-columns:repeat(2,1fr);gap:6px;padding:8px 10px}
  .kpi-box{padding:10px 6px}
  .cliente-metrics{grid-template-columns:1fr 1fr}
  .cliente-card .azioni{flex-direction:column}
}
</style>
</head>
<body>

<header>
  <h1>📋 Ellesse CRM</h1>
  <div class="sub">Agente Lelio Silipigni · Giro visite clienti</div>
  <div class="badge" id="header-badge">Caricamento...</div>
</header>

<!-- KPI STRIP -->
<div class="kpi-strip" id="kpi-strip"></div>

<!-- SEZIONE MAPPA -->
<section id="sezione-mappa" style="padding:0 14px;max-width:800px;margin:0 auto">
  <div class="sec-title">🗺 Mappa giro visite <span class="cnt" id="mappa-count"></span></div>
  <div id="mappa" style="height:380px;border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow);z-index:1;background:#1a2233"></div>
  <div style="display:flex;gap:8px;margin-top:8px;overflow-x:auto;white-space:nowrap;padding:2px" id="mappa-filtri"></div>
</section>

<!-- FILTRI -->
<section>
  <div class="filtri" id="filtri"></div>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <input class="search-box" id="search" placeholder="🔍 Cerca cliente, zona, mandante, referente..." oninput="renderClienti()" style="margin-bottom:0;flex:1">
    <button class="btn btn-add" onclick="apriNuovoCliente()" style="padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;background:var(--green);color:#000">+ Cliente</button>
  </div>
</section>

<!-- LISTA CLIENTI -->
<section id="lista-clienti"></section>

<!-- DETTAGLIO CLIENTE -->
<div id="detail-view">
  <div class="detail-header">
    <button class="back" onclick="chiudiDettaglio()">← Indietro</button>
    <h2 id="d-nome"></h2>
    <div class="info" id="d-info"></div>
  </div>
  <div class="detail-body">
    <div class="cliente-metrics" id="d-metrics"></div>
    <div class="tabs" id="d-tabs">
      <button class="tab active" onclick="switchTab('incontri')">📜 Incontri</button>
      <button class="tab" onclick="switchTab('info')">ℹ Info</button>
    </div>
    <div class="tab-content active" id="tab-incontri"></div>
    <div class="tab-content" id="tab-info"></div>
    <div style="margin-top:16px">
      <button class="btn btn-primary" onclick="apriNuovoIncontro(currentCliente)" style="width:100%">+ Registra nuovo incontro</button>
    </div>
  </div>
</div>

<!-- MODALE NUOVO INCONTRO -->
<div class="modal" id="modal-incontro">
  <div class="modal-content">
    <h3 id="modal-title">Nuovo incontro</h3>
    <label>Data</label>
    <input type="date" id="f-data">
    <div class="form-row">
      <div><label>Ora inizio</label><input type="time" id="f-ora"></div>
      <div><label>Ora fine</label><input type="time" id="f-ora-fine"></div>
    </div>
    <label>Argomenti trattati</label>
    <textarea id="f-argomenti" placeholder="Cosa avete discusso..."></textarea>
    <label>Decisioni / impegni presi</label>
    <textarea id="f-decisioni" placeholder="Ordini, accordi, richieste..."></textarea>
    <label>Prossimi passi</label>
    <textarea id="f-prossimi" placeholder="Da fare, follow-up, prossima visita..."></textarea>
    <label>Prossima visita programmata</label>
    <input type="date" id="f-prossima-data">
    <label>Note / promemoria</label>
    <textarea id="f-promemoria" placeholder="Extra..."></textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-secondary" onclick="chiudiModale()" style="flex:1">Annulla</button>
      <button class="btn btn-primary" onclick="salvaIncontro()" style="flex:2">Salva incontro</button>
    </div>
  </div>
</div>

<!-- MODALE NUOVO CLIENTE -->
<div class="modal" id="modal-cliente">
  <div class="modal-content">
    <h3>➕ Nuovo cliente</h3>
    <label>Nome cliente *</label>
    <input type="text" id="fc-nome" placeholder="Ragione sociale">
    <div class="form-row">
      <div><label>Categoria</label>
        <select id="fc-categoria">
          <option value="rivendita">Rivendita</option>
          <option value="installatore">Installatore</option>
          <option value="progettista">Progettista</option>
          <option value="impresa">Impresa edile</option>
          <option value="privato">Privato</option>
          <option value="altro">Altro</option>
        </select>
      </div>
      <div><label>Zona</label>
        <select id="fc-zona">
          <option value="Sicilia Ovest (Palermo)">Sicilia Ovest (PA)</option>
          <option value="Sicilia Ovest (Trapani)">Sicilia Ovest (TP)</option>
          <option value="Sicilia Ovest (Agrigento)">Sicilia Ovest (AG)</option>
          <option value="Sicilia Est (Catania)">Sicilia Est (CT)</option>
          <option value="Sicilia Est (Messina)">Sicilia Est (ME)</option>
          <option value="Sicilia Est (Siracusa)">Sicilia Est (SR)</option>
          <option value="Sicilia Sud (Ragusa)">Sicilia Sud (RG)</option>
          <option value="Sicilia Sud (Caltanissetta)">Sicilia Sud (CL)</option>
          <option value="Sicilia (Enna)">Sicilia (EN)</option>
          <option value="Altre regioni">Altre regioni</option>
        </select>
      </div>
    </div>
    <label>Aziende / mandanti</label>
    <div id="fc-mandanti-checkboxes" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
    </div>
    <label>Referente</label>
    <input type="text" id="fc-referente" placeholder="Nome e cognome">
    <div class="form-row">
      <div><label>Telefono</label>
        <input type="text" id="fc-telefono" placeholder="333 1234567">
      </div>
      <div><label>Email</label>
        <input type="email" id="fc-email" placeholder="nome@email.it">
      </div>
    </div>
    <label>Periodicità visite consigliata</label>
    <select id="fc-periodicita">
      <option value="15">Ogni 15 giorni</option>
      <option value="30" selected>Ogni mese (30gg)</option>
      <option value="45">Ogni 45 giorni</option>
      <option value="60">Ogni 2 mesi</option>
      <option value="90">Ogni 3 mesi</option>
      <option value="180">Ogni 6 mesi</option>
      <option value="365">Ogni anno</option>
    </select>
    <label>Note / appunti iniziali</label>
    <textarea id="fc-note" placeholder="Informazioni sul cliente..."></textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-secondary" onclick="chiudiModaleCliente()" style="flex:1">Annulla</button>
      <button class="btn btn-primary" onclick="salvaNuovoCliente()" style="flex:2">Aggiungi cliente</button>
    </div>
  </div>
</div>

// ===== STATO =====
let clienti = [];
let filtroAttivo = 'tutti';
let currentCliente = '';
let mapa = null;
let mapaMarkers = null;
let mapaFiltro = 'tutti';
let clientiConGeo = [];

function formattaData(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return dd+'/'+m+'/'+y;
}

function dataOggetto(d) {
  if (!d) return null;
  const [y,m,dd] = d.split('-');
  return new Date(+y, +m-1, +dd);
}

function diffGiorni(d1, d2) {
  if (!d1 || !d2) return null;
  const a = dataOggetto(d1);
  const b = dataOggetto(d2);
  return Math.round((a - b) / (1000*60*60*24));
}

function giorniDaOggi(d) {
  if (!d) return Infinity;
  const oggi = new Date();
  oggi.setHours(0,0,0,0);
  const data = dataOggetto(d);
  return Math.round((data - oggi) / (1000*60*60*24));
}

function giorniAllaProssima(c) {
  if (c.prossimaVisita) return giorniDaOggi(c.prossimaVisita);
  if (c.incontri?.length > 0 && c.periodicita) {
    const ultimo = c.incontri[c.incontri.length-1].data;
    const ultima = dataOggetto(ultimo);
    ultima.setDate(ultima.getDate() + c.periodicita);
    return Math.round((ultima - new Date()) / (1000*60*60*24));
  }
  return null;
}

function statoVisita(c) {
  const gg = giorniAllaProssima(c);
  if (gg === null) return 'gray';
  if (gg < 0) return 'red';
  if (gg <= 7) return 'green';
  if (gg <= 30) return 'yellow';
  return 'gray';
}

function labelStato(gg) {
  if (gg === null) return 'Da programmare';
  if (gg < 0) return `Scaduta da ${Math.abs(gg)}gg`;
  if (gg === 0) return 'Oggi!';
  if (gg === 1) return 'Domani!';
  return `Tra ${gg}gg`;
}

function calcolaGapMedio(c) {
  if (!c.incontri || c.incontri.length < 2) return null;
  const sorted = [...c.incontri].sort((a,b) => a.data.localeCompare(b.data));
  let tot = 0, n = 0;
  for (let i = 1; i < sorted.length; i++) {
    const g = diffGiorni(sorted[i].data, sorted[i-1].data);
    if (g !== null && g >= 0) { tot += g; n++; }
  }
  return n > 0 ? Math.round(tot / n) : null;
}

// ===== KPI =====
function calcolaKPI() {
  const oggi = new Date();
  const meseCorrente = oggi.getMonth();
  const annoCorrente = oggi.getFullYear();
  const visitatiQuestoMese = clienti.filter(c => 
    c.incontri?.some(i => { const [y,m] = i.data.split('-'); return +y === annoCorrente && +m-1 === meseCorrente; })
  ).length;
  let totGap = 0, nGap = 0;
  clienti.forEach(c => { const g = calcolaGapMedio(c); if (g !== null) { totGap += g; nGap++; } });
  const gapMedio = nGap > 0 ? Math.round(totGap / nGap) : null;
  const abbandonati = clienti.filter(c => { if (!c.incontri?.length) return false; return giorniDaOggi(c.incontri[c.incontri.length-1].data) > 60; }).length;
  const scadenzeCritiche = clienti.filter(c => { const gg = giorniAllaProssima(c); return gg !== null && gg <= 7; }).length;
  const scadute = clienti.filter(c => { const gg = giorniAllaProssima(c); return gg !== null && gg < 0; }).length;
  return { totali: clienti.length, visitatiMese, copertura: Math.round(visitatiQuestoMese/clienti.length*100)||0, gapMedio, abbandonati, scadenze: scadenzeCritiche, scadute, totIncontri: clienti.reduce((s,c) => s+(c.incontri?.length||0),0) };
}

function renderKPI() {
  const k = calcolaKPI();
  document.getElementById('kpi-strip').innerHTML = `
    <div class="kpi-box"><div class="lbl">Clienti</div><div class="val">${k.totali}</div><div class="note">Registrati</div></div>
    <div class="kpi-box"><div class="lbl">Visite mese</div><div class="val">${k.visitatiMese}</div><div class="note">${k.copertura}% copertura</div></div>
    <div class="kpi-box ${k.scadenze > 0 ? 'highlight' : ''}"><div class="lbl">Da visitare</div><div class="val">${k.scadenze}</div><div class="note">Nei prossimi 7gg</div></div>
    <div class="kpi-box ${k.scadute > 0 ? 'danger' : ''}"><div class="lbl">Scadute</div><div class="val" style="color:${k.scadute > 0 ? 'var(--red)' : 'var(--txt)'}">${k.scadute}</div><div class="note">Da riprogrammare</div></div>
    <div class="kpi-box"><div class="lbl">Gap medio</div><div class="val">${k.gapMedio !== null ? k.gapMedio + 'gg' : '—'}</div><div class="note">Tra visite · ${k.totIncontri} tot</div></div>
  `;
}

// ===== MAPPA GIRO VISITE =====
const coloriMandante = {
  "Biemme": "#4362b9", "Internorm": "#cc1e2c", "Gerflor": "#00a651", "Novoferm": "#f39200",
  "Ditec": "#005a9e", "Ferrero Legno": "#8b4513", "Cherubini": "#6a1b9a", "Roto": "#e91e63",
  "Navello": "#0097a7", "Altro": "#6b7a8c"
};

function avviaMappa() {
  if (mapa) return;
  mapa = L.map('mappa', { zoomControl: true, scrollWheelZoom: false }).setView([37.6, 14.0], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
  }).addTo(mapa);
  mapaMarkers = L.markerClusterGroup({ maxClusterRadius: 30 });
  document.getElementById('sezione-mappa').style.display = '';
}

function coloreStatoMappa(c) {
  const gg = giorniAllaProssima(c);
  if (gg === null) return '#6b7a8c';
  if (gg < 0) return '#ff6b7a';
  if (gg <= 7) return '#3ddc97';
  if (gg <= 30) return '#f6c453';
  return '#6b7a8c';
}

function popupMappa(c) {
  const gg = giorniAllaProssima(c);
  const stato = statoVisita(c);
  const label = labelStato(gg);
  const ultimo = c.incontri?.length > 0 ? c.incontri[c.incontri.length-1] : null;
  return `<div style="font-family:system-ui;min-width:200px">
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">${c.nome}</div>
    <div style="font-size:11px;color:#555">📍 ${c.zona}</div>
    <div style="font-size:11px;color:#555;margin-bottom:4px">🏢 ${c.mandanti.join(', ')}</div>
    <div style="margin:6px 0">
      <span style="padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;background:${coloreStatoMappa(c)}">${label}</span>
      ${c.periodicita ? `<span style="padding:2px 8px;border-radius:10px;font-size:10px;background:#eee;color:#333;margin-left:4px">🔄 ${c.periodicita}gg</span>` : ''}
    </div>
    ${ultimo ? `<div style="font-size:11px;color:#666;border-top:1px solid #eee;padding-top:4px">📝 ${formattaData(ultimo.data)}: ${ultimo.argomenti.slice(0,50)}${ultimo.argomenti.length > 50 ? '...' : ''}</div>` : ''}
    <div style="margin-top:8px;text-align:center">
      <button onclick="apriDettaglio('${c.nome}')" style="background:#6ea8fe;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;width:100%">Apri scheda cliente</button>
    </div>
  </div>`;
}

function renderMappa() {
  avviaMappa();
  mapaMarkers.clearLayers();

  // Filtra clienti per mandante
  let visibili = clienti.filter(c => c.lat && c.lon);
  if (mapaFiltro !== 'tutti') {
    visibili = visibili.filter(c => c.mandanti.includes(mapaFiltro));
  }

  visibili.forEach(c => {
    const colore = mapaFiltro === 'tutti' ? coloreStatoMappa(c) : (coloriMandante[c.mandanti.find(m => m === mapaFiltro)] || '#6ea8fe');
    const icona = L.divIcon({
      className: '',
      html: `<div style="width:24px;height:24px;border-radius:50%;background:${colore};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800">${c.nome[0]}</div>`,
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12]
    });
    const marker = L.marker([c.lat, c.lon], { icon: icona });
    marker.bindPopup(popupMappa(c));
    mapaMarkers.addLayer(marker);
  });

  mapa.addLayer(mapaMarkers);
  document.getElementById('mappa-count').textContent = `${visibili.length} clienti`;

  // Fit bounds se ci sono marker
  if (visibili.length > 0) {
    const bounds = L.latLngBounds(visibili.map(c => [c.lat, c.lon]));
    mapa.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
  }

  // Filtri mandante nella mappa
  const aziende = [...new Set(clienti.flatMap(c => c.mandanti))].sort();
  let html = `<button class="f-btn ${mapaFiltro === 'tutti' ? 'active' : ''}" onclick="mapaFiltro='tutti';renderMappa()">Tutti</button>`;
  aziende.forEach(az => {
    html += `<button class="f-btn ${mapaFiltro === az ? 'active' : ''}" onclick="mapaFiltro='${az}';renderMappa()">${az}</button>`;
  });
  document.getElementById('mappa-filtri').innerHTML = html;
}

// ===== LISTA CLIENTI =====
function renderClienti() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtrati = clienti;

  if (filtroAttivo === 'urgenti') {
    filtrati = filtrati.filter(c => { const gg = giorniAllaProssima(c); return gg !== null && gg <= 7; });
  } else if (filtroAttivo === 'oggi') {
    filtrati = filtrati.filter(c => { const gg = giorniAllaProssima(c); return gg !== null && gg <= 1; });
  } else if (filtroAttivo === 'per-azienda') {
    // Vista raggruppata per azienda
    renderClientiPerAzienda(q);
    return;
  } else if (filtroAttivo !== 'tutti') {
    filtrati = filtrati.filter(c => c.mandanti.includes(filtroAttivo));
  }

  if (q) {
    filtrati = filtrati.filter(c => 
      c.nome.toLowerCase().includes(q) || c.zona.toLowerCase().includes(q) ||
      c.mandanti.some(m => m.toLowerCase().includes(q)) ||
      (c.contatti.referente || '').toLowerCase().includes(q)
    );
  }

  filtrati.sort((a,b) => {
    const ga = giorniAllaProssima(a), gb = giorniAllaProssima(b);
    if (ga === null && gb === null) return 0;
    if (ga === null) return 1; if (gb === null) return -1;
    return ga - gb;
  });

  const el = document.getElementById('lista-clienti');
  if (filtrati.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">📭</div>Nessun cliente trovato</div>';
    document.getElementById('header-badge').textContent = '0 clienti';
    return;
  }

  el.innerHTML = filtrati.map(c => renderCardCliente(c)).join('');
  document.getElementById('header-badge').textContent = `${filtrati.length} clienti`;
}

function renderCardCliente(c) {
  const gg = giorniAllaProssima(c);
  const stato = statoVisita(c);
  const label = labelStato(gg);
  const ultimo = c.incontri?.length > 0 ? c.incontri[c.incontri.length-1] : null;
  const gapMedio = calcolaGapMedio(c);
  const giorniDaUltima = ultimo ? giorniDaOggi(ultimo.data) : null;
  return `<div class="cliente-card" onclick="apriDettaglio('${c.nome}')">
    <div class="top">
      <div>
        <div class="nome">${c.nome}</div>
        <div class="zona">${c.zona}</div>
        <div class="mandanti">${c.mandanti.join(' · ')}</div>
        ${c.contatti.referente ? `<div class="badge-visite">👤 ${c.contatti.referente}</div>` : ''}
      </div>
      <span class="pill ${stato}">${label}</span>
    </div>
    ${ultimo ? `<div style="font-size:12px;color:var(--txt3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
      <span>📝 ${formattaData(ultimo.data)} — ${ultimo.argomenti.slice(0,60)}${ultimo.argomenti.length > 60 ? '...' : ''}</span>
      ${giorniDaUltima !== null ? `<span style="color:${giorniDaUltima > 60 ? 'var(--red)' : giorniDaUltima > 30 ? 'var(--yellow)' : 'var(--green)'}">${giorniDaUltima}gg fa</span>` : ''}
    </div>` : ''}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-top:6px">
      <span>📊 ${c.incontri?.length || 0} incontri</span>
      ${gapMedio !== null ? `<span>⏱ gap medio ${gapMedio}gg</span>` : ''}
      ${c.periodicita ? `<span>🔄 ogni ${c.periodicita}gg</span>` : ''}
    </div>
    <div class="azioni">
      <button class="btn btn-primary" onclick="event.stopPropagation();apriNuovoIncontro('${c.nome}')">+ Incontro</button>
      <button class="btn btn-secondary" onclick="event.stopPropagation();apriDettaglio('${c.nome}')">Dettaglio</button>
    </div>
  </div>`;
}

// ===== VISTA PER AZIENDA =====
function renderClientiPerAzienda(q) {
  // Raggruppa per mandante
  const gruppi = {};
  clienti.forEach(c => {
    if (q && !c.nome.toLowerCase().includes(q) && !c.zona.toLowerCase().includes(q) && !(c.contatti.referente||'').toLowerCase().includes(q)) return;
    c.mandanti.forEach(m => {
      if (!gruppi[m]) gruppi[m] = [];
      gruppi[m].push(c);
    });
  });

  const ordine = ["Biemme","Internorm","Gerflor","Novoferm","Ditec","Ferrero Legno","Cherubini","Roto","Navello","Altro"];
  const chiaviOrdinate = ordine.filter(a => gruppi[a]).concat(Object.keys(gruppi).filter(a => !ordine.includes(a)).sort());

  let html = '';
  let totClienti = 0;
  chiaviOrdinate.forEach(az => {
    const lista = gruppi[az];
    totClienti += lista.length;
    // Raggruppa per zona
    const perZona = {};
    lista.forEach(c => {
      if (!perZona[c.zona]) perZona[c.zona] = [];
      perZona[c.zona].push(c);
    });

    html += `<div class="azienda-group">
      <div class="azienda-header">
        <div class="azienda-icon" style="background:${AZIENDE_COLORI[az] || '#6b7a8c'}">${az[0]}</div>
        <div class="azienda-nome">${az}</div>
        <div class="azienda-count">${lista.length} clienti</div>
      </div>`;

    Object.keys(perZona).sort().forEach(zona => {
      html += `<div style="margin-bottom:8px">
        <div style="font-size:11px;color:var(--txt3);font-weight:600;padding:0 0 4px 4px">📍 ${zona}</div>`;
      perZona[zona].forEach(c => {
        html += renderCardCliente(c);
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  const el = document.getElementById('lista-clienti');
  if (!chiaviOrdinate.length) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">📭</div>Nessun cliente trovato</div>';
  } else {
    el.innerHTML = html;
  }
  document.getElementById('header-badge').textContent = `${totClienti} clienti`;
}

        <div><span style="color:var(--txt3);font-size:12px">Zona</span><br><span>${c.zona}</span></div>
        <div><span style="color:var(--txt3);font-size:12px">Aziende</span><br><span style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px">${c.mandanti.map(m => `<span class="pill blue">${m}</span>`).join(' ')}</span></div>
        <div><span style="color:var(--txt3);font-size:12px">Referente</span><br><span>${c.contatti.referente || '—'}</span></div>
        <div><span style="color:var(--txt3);font-size:12px">Telefono</span><br><span>${c.contatti.telefono || '—'}</span></div>
        <div><span style="color:var(--txt3);font-size:12px">Email</span><br><span>${c.contatti.email || '—'}</span></div>
        <div><span style="color:var(--txt3);font-size:12px">Periodicità visite</span><br><span>${c.periodicita ? 'Ogni ' + c.periodicita + 'gg' : 'Da definire'}</span></div>
        ${c.prossimaVisita ? `<div><span style="color:var(--txt3);font-size:12px">Prossima visita</span><br><span style="color:var(--green)">${formattaData(c.prossimaVisita)} (${labelStato(giorniDaOggi(c.prossimaVisita))})</span></div>` : ''}
      </div>
    </div>`;
  document.getElementById('detail-view').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function chiudiDettaglio() {
  document.getElementById('detail-view').classList.remove('show');
  document.body.style.overflow = '';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

// ===== MODALE INCONTRO =====
function apriNuovoIncontro(nome) {
  currentCliente = nome;
  document.getElementById('modal-title').textContent = `📝 Nuovo incontro — ${nome}`;
  document.getElementById('f-data').value = new Date().toISOString().split('T')[0];
  document.getElementById('f-ora').value = ''; document.getElementById('f-ora-fine').value = '';
  document.getElementById('f-argomenti').value = ''; document.getElementById('f-decisioni').value = '';
  document.getElementById('f-prossimi').value = ''; document.getElementById('f-prossima-data').value = '';
  document.getElementById('f-promemoria').value = '';
  document.getElementById('modal-incontro').classList.add('show');
}

function chiudiModale() {
  document.getElementById('modal-incontro').classList.remove('show');
}

function salvaIncontro() {
  const c = clienti.find(x => x.nome === currentCliente);
  if (!c) return;
  const incontro = {
    data: document.getElementById('f-data').value, ora: document.getElementById('f-ora').value,
    ora_fine: document.getElementById('f-ora-fine').value, argomenti: document.getElementById('f-argomenti').value,
    decisioni: document.getElementById('f-decisioni').value, prossimi_passi: document.getElementById('f-prossimi').value,
    promemoria: document.getElementById('f-promemoria').value, stato: 'aperto'
  };
  if (!c.incontri) c.incontri = [];
  c.incontri.push(incontro);
  if (document.getElementById('f-prossima-data').value) c.prossimaVisita = document.getElementById('f-prossima-data').value;
  chiudiModale();
  renderKPI(); renderClienti();
  if (document.getElementById('detail-view').classList.contains('show')) apriDettaglio(currentCliente);
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 24px;border-radius:12px;font-weight:700;z-index:999;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .3s';
  msg.textContent = '✅ Incontro registrato!';
  document.body.appendChild(msg);
  setTimeout(() => { msg.style.opacity = '0'; setTimeout(() => msg.remove(), 300); }, 2000);
}

// ===== MODALE NUOVO CLIENTE =====
function apriNuovoCliente() {
  document.getElementById('fc-nome').value = '';
  document.getElementById('fc-categoria').value = 'rivendita';
  document.getElementById('fc-zona').value = 'Sicilia Ovest (Palermo)';
  document.getElementById('fc-referente').value = '';
  document.getElementById('fc-telefono').value = '';
  document.getElementById('fc-email').value = '';
  document.getElementById('fc-periodicita').value = '30';
  document.getElementById('fc-note').value = '';

  // Genera checkbox mandanti
  const container = document.getElementById('fc-mandanti-checkboxes');
  container.innerHTML = AZIENDE_DISPONIBILI.map(az =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer">
      <input type="checkbox" value="${az}" style="width:16px;height:16px;accent-color:var(--accent)">${az}
    </label>`
  ).join('');

  document.getElementById('modal-cliente').classList.add('show');
}

function chiudiModaleCliente() {
  document.getElementById('modal-cliente').classList.remove('show');
}

function salvaNuovoCliente() {
  const nome = document.getElementById('fc-nome').value.trim();
  if (!nome) { alert('Inserisci il nome del cliente'); return; }

  const mandanti = [];
  document.querySelectorAll('#fc-mandanti-checkboxes input:checked').forEach(cb => mandanti.push(cb.value));

  const cliente = {
    nome,
    categoria: document.getElementById('fc-categoria').value,
    zona: document.getElementById('fc-zona').value,
    mandanti: mandanti.length ? mandanti : ['Altro'],
    contatti: {
      telefono: document.getElementById('fc-telefono').value,
      email: document.getElementById('fc-email').value,
      referente: document.getElementById('fc-referente').value,
    },
    incontri: [],
    periodicita: parseInt(document.getElementById('fc-periodicita').value) || 90,
    prossimaVisita: null,
  };

  clienti.push(cliente);
  chiudiModaleCliente();
  renderKPI(); renderFiltri(); renderClienti();

  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 24px;border-radius:12px;font-weight:700;z-index:999;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .3s';
  msg.textContent = `✅ Cliente "${nome}" aggiunto!`;
  document.body.appendChild(msg);
  setTimeout(() => { msg.style.opacity = '0'; setTimeout(() => msg.remove(), 300); }, 2000);
}

// ===== INIZIALIZZAZIONE =====
document.addEventListener('DOMContentLoaded', () => {
  // Carica dati geolocalizzati (clienti_geo.json) + merge con clienti.json
  Promise.all([
    fetch('clienti_geo.json').then(r => r.json()).catch(() => null),
    fetch('clienti.json').then(r => r.json()).catch(() => null),
  ]).then(([geo, json]) => {
    if (geo && geo.length) {
      clientiConGeo = geo;
      clienti = geo;
    } else if (json?.clienti?.length) {
      clienti = json.clienti.map(c => ({ ...c, periodicita: c.periodicita || 90 }));
    } else {
      clienti = FALLBACK;
    }
    renderKPI(); renderFiltri(); renderClienti();
    setTimeout(() => renderMappa(), 300);
  }).catch(() => {
    clienti = FALLBACK;
    renderKPI(); renderFiltri(); renderClienti();
    setTimeout(() => renderMappa(), 300);
  });
});
</script>
</body>
</html>
