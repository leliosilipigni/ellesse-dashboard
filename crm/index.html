<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Ellesse CRM — Giro Visite</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#111827;--card2:#1a2235;--border:#1e2a45;--txt:#e2e8f0;--txt2:#8892a8;--txt3:#56607a;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--emerald:#10b981;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:system-ui,-apple-system,Inter,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:0 0 80px}
header{padding:20px 16px 0;max-width:900px;margin:0 auto}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.header-titles h1{font-size:20px;font-weight:700;letter-spacing:-.4px}
.header-titles .sub{font-size:12px;color:var(--txt2);margin-top:1px}
.header-stats{display:flex;gap:6px;font-size:11px}
.header-stats span{background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border);color:var(--txt2)}
/* TOP KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px;max-width:900px;margin:0 auto}
.kpi-tile{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden}
.kpi-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:.7}
.kpi-tile.green::before{background:var(--green)}
.kpi-tile.amber::before{background:var(--yellow)}
.kpi-tile.red::before{background:var(--red)}
.kpi-tile.emerald::before{background:var(--emerald)}
.kpi-tile .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);font-weight:600;margin-bottom:2px}
.kpi-tile .val{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi-tile .val small{font-size:13px;font-weight:600;color:var(--txt2);margin-left:4px}
.kpi-tile .trend{font-size:11px;margin-top:3px;display:flex;align-items:center;gap:4px}
.kpi-tile .trend.up{color:var(--green)}
.kpi-tile .trend.down{color:var(--red)}
.kpi-tile .trend.neutral{color:var(--txt3)}
/* SECTION */
.section{padding:16px 16px 0;max-width:900px;margin:0 auto}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-title .count{font-size:11px;font-weight:600;color:var(--txt3);background:var(--card);padding:2px 10px;border-radius:10px}
.sec-actions{display:flex;gap:6px}
.sec-actions button{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--txt2);cursor:pointer;transition:all .12s}
.sec-actions button:hover{background:var(--card2);color:var(--txt)}
.sec-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* MAPPA */
.map-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
#mappa{height:340px;background:var(--card2)}
.map-filtri{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;white-space:nowrap;border-top:1px solid var(--border)}
.map-filtri button{padding:4px 12px;border-radius:6px;font-size:10px;font-weight:600;border:none;background:var(--card2);color:var(--txt2);cursor:pointer;flex-shrink:0}
.map-filtri button.active{background:var(--accent);color:#fff}
/* FILTRI E RICERCA */
.filtri-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.filtri-row .f-btn{padding:5px 14px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--txt2);cursor:pointer;flex-shrink:0;transition:all .1s}
.filtri-row .f-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-add{display:flex;gap:8px;margin-bottom:10px}
.search-add input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:13px}
.search-add input::placeholder{color:var(--txt3)}
.search-add button{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:var(--emerald);color:#fff;white-space:nowrap}
/* CLIENTE CARD */
.cliente-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.cliente-card:hover{border-color:var(--accent)}
.cliente-card:active{transform:scale(.99)}
.cliente-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cliente-card .info .nome{font-size:15px;font-weight:700}
.cliente-card .info .meta{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;flex-wrap:wrap;gap:3px}
.cliente-card .info .meta span{padding:1px 6px;border-radius:4px;background:var(--card2);font-size:10px;color:var(--txt3)}
.cliente-card .badge{padding:3px 10px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.badge-verde{background:rgba(34,197,94,.15);color:var(--green)}
.badge-giallo{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-rosso{background:rgba(239,68,68,.15);color:var(--red)}
.badge-grigio{background:rgba(86,96,122,.15);color:var(--txt3)}
.badge-blu{background:rgba(59,130,246,.15);color:var(--accent)}
.cliente-card .row2{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--txt3)}
.cliente-card .row2 .stat{display:flex;align-items:center;gap:4px}
.cliente-card .row2 .stat .val{font-weight:600;color:var(--txt2)}
.cliente-card .row3{margin-top:8px;display:flex;gap:6px}
.cliente-card .row3 button{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;border:none;cursor:pointer;transition:all .1s}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:transparent;color:var(--txt2);border:1px solid var(--border)!important}
.btn-outline:hover{background:var(--card2);color:var(--txt)}
/* DETTAGLIO */
#detail-view{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:0 0 100px}
#detail-view.show{display:block}
.det-header{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:10;border-bottom:1px solid var(--border)}
.det-header .back{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;padding:2px 0}
.det-header h2{font-size:19px;margin-top:2px}
.det-header .info{font-size:12px;color:var(--txt2);margin-top:1px}
.det-body{padding:14px 16px}
.det-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.det-metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
.det-metric .mv{font-size:18px;font-weight:800}
.det-metric .ml{font-size:8px;text-transform:uppercase;color:var(--txt3);font-weight:600;margin-top:1px}
.det-tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:2px;overflow-x:auto}
.det-tab{padding:6px 14px;border-radius:6px 6px 0 0;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--txt3);cursor:pointer;flex-shrink:0}
.det-tab.active{background:var(--card);color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block}
.incontro-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.incontro-item .top{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3)}
.incontro-item .gap{color:var(--accent)}
.incontro-item .arg{font-size:13px;margin-top:4px}
.incontro-item .dec{font-size:12px;color:var(--accent);margin-top:2px}
.incontro-item .next{font-size:12px;color:var(--emerald);margin-top:2px}
/* MODALE */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px 30px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-content h3{font-size:17px;margin-bottom:14px}
.modal-content label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:3px;margin-top:10px}
.modal-content input,.modal-content textarea,.modal-content select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:13px;font-family:inherit}
.modal-content textarea{resize:vertical;min-height:60px}
.modal-content .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns button{padding:11px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer}
.ml-annulla{flex:1;background:var(--card2);color:var(--txt2)}
.ml-conferma{flex:2;background:var(--accent);color:#fff}
.ml-success{flex:2;background:var(--emerald);color:#fff}
.empty-state{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty-state .emoji{font-size:42px;margin-bottom:8px}
.empty-state p{font-size:13px}
@media(max-width:560px){
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .det-metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-brand">
      <div class="header-logo">EL</div>
      <div class="header-titles">
        <h1>Giro Visite</h1>
        <div class="sub">Ellesse Rappresentanze · Lelio Silipigni</div>
      </div>
    </div>
    <div class="header-stats">
      <span id="h-oggi"></span>
    </div>
  </div>
</header>

<!-- KPI ROW -->
<div class="kpi-row" id="kpi-row"></div>

<!-- MAPPA -->
<div class="section">
  <div class="sec-header">
    <div class="sec-title">🗺️ Mappa <span class="count" id="m-count"></span></div>
  </div>
  <div class="map-wrap">
    <div id="mappa"></div>
    <div class="map-filtri" id="m-filtri"></div>
  </div>
</div>

<!-- CLIENTI -->
<div class="section">
  <div class="sec-header">
    <div class="sec-title">👥 Clienti <span class="count" id="c-count"></span></div>
    <div class="sec-actions">
      <button onclick="apriNuovoCliente()" class="primary">+ Nuovo</button>
    </div>
  </div>
  <div class="filtri-row" id="filtri-row"></div>
  <div class="search-add">
    <input id="search" placeholder="🔍 Cerca cliente, zona, mandante, referente..." oninput="renderClienti()">
  </div>
  <div id="lista-clienti"></div>
</div>

<!-- DETTAGLIO CLIENTE -->
<div id="detail-view">
  <div class="det-header">
    <button class="back" onclick="chiudiDettaglio()">← Indietro</button>
    <h2 id="d-nome"></h2>
    <div class="info" id="d-info"></div>
  </div>
  <div class="det-body">
    <div class="det-metrics" id="d-metrics"></div>
    <div class="det-tabs" id="d-tabs">
      <button class="det-tab active" onclick="switchTab('storico')">📜 Storico</button>
      <button class="det-tab" onclick="switchTab('info')">ℹ️ Scheda</button>
    </div>
    <div class="tab-pane active" id="tab-storico"></div>
    <div class="tab-pane" id="tab-info"></div>
    <div style="margin-top:14px">
      <button class="btn-primary" onclick="apriNuovoIncontro(currentCliente)" style="width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer">+ Registra incontro</button>
    </div>
  </div>
</div>

<!-- MODALE INCONTRO -->
<div class="modal" id="modal-incontro">
  <div class="modal-content">
    <h3 id="mi-titolo">Nuovo incontro</h3>
    <label>Data</label>
    <input type="date" id="f-data">
    <div class="form-row">
      <div><label>Ora inizio</label><input type="time" id="f-ora"></div>
      <div><label>Ora fine</label><input type="time" id="f-ora-fine"></div>
    </div>
    <label>Argomenti</label>
    <textarea id="f-arg" placeholder="Cosa avete discusso..."></textarea>
    <label>Decisioni / impegni</label>
    <textarea id="f-dec" placeholder="Ordini, accordi, richieste..."></textarea>
    <label>Prossimi passi</label>
    <textarea id="f-next" placeholder="Da fare, follow-up..."></textarea>
    <label>Prossima visita</label>
    <input type="date" id="f-prox">
    <label>Promemoria</label>
    <textarea id="f-rem" placeholder="Extra..."></textarea>
    <div class="modal-btns">
      <button class="ml-annulla" onclick="chiudiModale()">Annulla</button>
      <button class="ml-conferma" onclick="salvaIncontro()">Salva</button>
    </div>
  </div>
</div>

<!-- MODALE CLIENTE -->
<div class="modal" id="modal-cliente">
  <div class="modal-content">
    <h3>➕ Nuovo cliente</h3>
    <label>Nome *</label>
    <input type="text" id="fc-nome" placeholder="Ragione sociale">
    <div class="form-row">
      <div><label>Categoria</label>
        <select id="fc-cat">
          <option value="rivendita">Rivendita</option><option value="installatore">Installatore</option>
          <option value="progettista">Progettista</option><option value="impresa">Impresa</option>
          <option value="privato">Privato</option><option value="altro">Altro</option>
        </select>
      </div>
      <div><label>Zona</label>
        <select id="fc-zona">
          <option value="Sicilia Ovest (Palermo)">Palermo</option><option value="Sicilia Ovest (Trapani)">Trapani</option>
          <option value="Sicilia Ovest (Agrigento)">Agrigento</option><option value="Sicilia Est (Catania)">Catania</option>
          <option value="Sicilia Est (Messina)">Messina</option><option value="Sicilia Est (Siracusa)">Siracusa</option>
          <option value="Sicilia Est (Ragusa)">Ragusa</option><option value="Sicilia Sud (Caltanissetta)">Caltanissetta</option>
          <option value="Sicilia (Enna)">Enna</option>
        </select>
      </div>
    </div>
    <label>Mandanti</label>
    <div id="fc-mand" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px"></div>
    <label>Referente</label>
    <input type="text" id="fc-ref" placeholder="Nome e cognome">
    <div class="form-row">
      <div><label>Tel.</label><input type="text" id="fc-tel" placeholder="333 1234567"></div>
      <div><label>Email</label><input type="email" id="fc-email" placeholder="nome@email.it"></div>
    </div>
    <label>Periodicità</label>
    <select id="fc-per">
      <option value="15">15gg</option><option value="30" selected>30gg (mese)</option>
      <option value="45">45gg</option><option value="60">60gg (2 mesi)</option>
      <option value="90">90gg (3 mesi)</option><option value="180">180gg (6 mesi)</option>
    </select>
    <div class="modal-btns">
      <button class="ml-annulla" onclick="chiudiModaleCliente()">Annulla</button>
      <button class="ml-success" onclick="salvaNuovoCliente()">Aggiungi</button>
    </div>
  </div>
</div>

// ===== STATO =====
let clienti = [];
let filtro = 'tutti';
let currentCliente = '';
let mapa = null, mCluster = null, mFiltro = 'tutti';

function fData(d){if(!d)return'—';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
function dObj(d){if(!d)return null;const[y,m,dd]=d.split('-');return new Date(+y,+m-1,+dd)}
function diffG(d1,d2){if(!d1||!d2)return null;return Math.round((dObj(d1)-dObj(d2))/(864e5))}
function daOggi(d){if(!d)return Infinity;const o=new Date();o.setHours(0,0,0,0);return Math.round((dObj(d)-o)/(864e5))}
function proxG(c){if(c.prossimaVisita)return daOggi(c.prossimaVisita);if(c.incontri?.length&&c.periodicita){const u=dObj(c.incontri[c.incontri.length-1].data);u.setDate(u.getDate()+c.periodicita);return Math.round((u-new Date())/(864e5))}return null}
function statoVis(c){const g=proxG(c);if(g===null)return'gray';if(g<0)return'red';if(g<=7)return'green';if(g<=30)return'yellow';return'gray'}
function lblStato(g){if(g===null)return'Da programmare';if(g<0)return`Scaduta da ${Math.abs(g)}gg`;if(g===0)return'Oggi!';if(g===1)return'Domani!';return`Tra ${g}gg`}
function gapMed(c){if(!c.incontri||c.incontri.length<2)return null;const s=[...c.incontri].sort((a,b)=>a.data.localeCompare(b.data));let t=0,n=0;for(let i=1;i<s.length;i++){const g=diffG(s[i].data,s[i-1].data);if(g!==null&&g>=0){t+=g;n++}}return n>0?Math.round(t/n):null}

// ===== KPI =====
function calcolaKPI(){
  const oggi=new Date(), mc=oggi.getMonth(), ac=oggi.getFullYear();
  const vm=clienti.filter(c=>c.incontri?.some(i=>{const[y,m]=i.data.split('-');return +y===ac&&+m-1===mc})).length;
  let tg=0,ng=0;clienti.forEach(c=>{const g=gapMed(c);if(g!==null){tg+=g;ng++}});
  const gm=ng>0?Math.round(tg/ng):null;
  const sc=clienti.filter(c=>{const g=proxG(c);return g!==null&&g<=7}).length;
  const sd=clienti.filter(c=>{const g=proxG(c);return g!==null&&g<0}).length;
  return {tot:clienti.length,vm,cop:Math.round(vm/clienti.length*100)||0,gm,sc,sd,ti:clienti.reduce((s,c)=>s+(c.incontri?.length||0),0)};
}

function renderKPI(){
  const k=calcolaKPI();
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi-tile emerald"><div class="lbl">Clienti</div><div class="val">${k.tot}<small>attivi</small></div><div class="trend neutral">${k.ti} incontri totali</div></div>
    <div class="kpi-tile green"><div class="lbl">Visite mese</div><div class="val">${k.vm}<small>su ${k.tot}</small></div><div class="trend up">${k.cop}% copertura</div></div>
    <div class="kpi-tile ${k.sc>0?'amber':''}"><div class="lbl">Da visitare</div><div class="val">${k.sc}<small>prossimi 7gg</small></div><div class="trend ${k.sc>0?'up':'neutral'}">${k.sc>0?'🔔 Attenzione':'Nessuna urgenza'}</div></div>
    <div class="kpi-tile ${k.sd>0?'red':''}"><div class="lbl">Scadute</div><div class="val">${k.sd}<small>da riprogrammare</small></div><div class="trend ${k.sd>0?'down':'neutral'}">${k.sd>0?'Da recuperare':'OK'}</div></div>
  `;
  document.getElementById('h-oggi').textContent=new Date().toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
}

// ===== MAPPA =====
function initMappa(){
  if(mapa)return;
  mapa=L.map('mappa',{zoomControl:true,scrollWheelZoom:false}).setView([37.6,14.0],8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'',maxZoom:18}).addTo(mapa);
  mCluster=L.markerClusterGroup({maxClusterRadius:35,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
}

function colMarker(c){
  const g=proxG(c);
  if(g===null)return'#6b7280';if(g<0)return'#ef4444';if(g<=7)return'#22c55e';if(g<=30)return'#eab308';
  return'#6b7280';
}

function popupHTML(c){
  const g=proxG(c),s=statoVis(c),lb=lblStato(g);
  const u=c.incontri?.length>0?c.incontri[c.incontri.length-1]:null;
  return `<div style="font-family:system-ui;min-width:180px">
    <div style="font-weight:700;font-size:14px;margin-bottom:2px">${c.nome}</div>
    <div style="font-size:11px;color:#666;margin-bottom:4px">📍 ${c.zona} · 🏢 ${c.mandanti.join(', ')}</div>
    <div style="margin:4px 0"><span style="padding:2px 10px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;background:${colMarker(c)}">${lb}</span></div>
    ${u?`<div style="font-size:11px;color:#888;border-top:1px solid #eee;padding-top:4px">📝 ${fData(u.data)}: ${u.argomenti.slice(0,45)}${u.argomenti.length>45?'...':''}</div>`:''}
    <div style="margin-top:6px"><button onclick="apriDettaglio('${c.nome}')" style="background:#3b82f6;color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;width:100%">Apri scheda</button></div>
  </div>`;
}

function renderMappa(){
  initMappa();
  mCluster.clearLayers();
  let v=clienti.filter(c=>c.lat&&c.lon);
  if(mFiltro!=='tutti')v=v.filter(c=>c.mandanti.includes(mFiltro));
  v.forEach(c=>{
    const col=mFiltro==='tutti'?colMarker(c):(AZ_COL[c.mandanti.find(m=>m===mFiltro)]||'#6ea8fe');
    const ic=L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50%;background:${col};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:800">${c.nome[0]}</div>`,iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-11]});
    const mk=L.marker([c.lat,c.lon],{icon:ic}).bindPopup(popupHTML(c));
    mCluster.addLayer(mk);
  });
  mapa.addLayer(mCluster);
  document.getElementById('m-count').textContent=`${v.length} su ${clienti.length}`;
  if(v.length){const b=L.latLngBounds(v.map(c=>[c.lat,c.lon]));mapa.fitBounds(b,{padding:[20,20],maxZoom:10})}
  const az=[...new Set(clienti.flatMap(c=>c.mandanti))].sort();
  document.getElementById('m-filtri').innerHTML=
    `<button class="${mFiltro==='tutti'?'active':''}" onclick="mFiltro='tutti';renderMappa()">Tutti</button>`+
    az.map(a=>`<button class="${mFiltro===a?'active':''}" onclick="mFiltro='${a}';renderMappa()">${a}</button>`).join('');
}

// ===== LISTA CLIENTI =====
function renderClienti(){
  const q=document.getElementById('search').value.toLowerCase();
  let f=clienti;
  if(filtro==='urgenti')f=f.filter(c=>{const g=proxG(c);return g!==null&&g<=7});
  else if(filtro==='oggi')f=f.filter(c=>{const g=proxG(c);return g!==null&&g<=1});
  else if(filtro!=='tutti'&&filtro!=='per-az')f=f.filter(c=>c.mandanti.includes(filtro));
  if(q)f=f.filter(c=>c.nome.toLowerCase().includes(q)||c.zona.toLowerCase().includes(q)||c.mandanti.some(m=>m.toLowerCase().includes(q))||(c.contatti.referente||'').toLowerCase().includes(q));
  f.sort((a,b)=>{const ga=proxG(a),gb=proxG(b);if(ga===null&&gb===null)return 0;if(ga===null)return 1;if(gb===null)return -1;return ga-gb});
  const el=document.getElementById('lista-clienti');
  if(!f.length){el.innerHTML='<div class="empty-state"><div class="emoji">📭</div><p>Nessun cliente trovato</p></div>';document.getElementById('c-count').textContent='0';return}
  document.getElementById('c-count').textContent=f.length;
  el.innerHTML=f.map(c=>{
    const g=proxG(c),s=statoVis(c),lb=lblStato(g),gm=gapMed(c),u=c.incontri?.length>0?c.incontri[c.incontri.length-1]:null,gg=u?daOggi(u.data):null;
    const badgeCls={green:'badge-verde',red:'badge-rosso',yellow:'badge-giallo',gray:'badge-grigio'}[s]||'badge-grigio';
    return `<div class="cliente-card" onclick="apriDettaglio('${c.nome}')">
      <div class="row1">
        <div class="info">
          <div class="nome">${c.nome}</div>
          <div class="meta">📍 ${c.zona} ${c.mandanti.map(m=>`<span>${m}</span>`).join('')} ${c.contatti.referente?`👤 ${c.contatti.referente}`:''}</div>
        </div>
        <span class="badge ${badgeCls}">${lb}</span>
      </div>
      ${u?`<div class="row2"><span class="stat">📝 Ultimo: <span class="val">${fData(u.data)}</span></span><span class="stat" style="color:${gg>60?'var(--red)':gg>30?'var(--yellow)':'var(--green)'}">${gg}gg fa</span></div>`:''}
      <div class="row2" style="border-top:none;padding-top:2px">
        <span class="stat">📊 <span class="val">${c.incontri?.length||0}</span> incontri</span>
        ${gm!==null?`<span class="stat">⏱ <span class="val">${gm}gg</span> gap medio</span>`:''}
        ${c.periodicita?`<span class="stat">🔄 <span class="val">${c.periodicita}gg</span></span>`:''}
      </div>
      <div class="row3">
        <button class="btn-primary" onclick="event.stopPropagation();apriNuovoIncontro('${c.nome}')">+ Incontro</button>
        <button class="btn-outline" onclick="event.stopPropagation();apriDettaglio('${c.nome}')">Dettaglio</button>
      </div>
    </div>`;
  }).join('');
}

// ===== FILTRI =====
function renderFiltri(){
  const az=[...new Set(clienti.flatMap(c=>c.mandanti))].sort();
  document.getElementById('filtri-row').innerHTML=
    `<button class="f-btn ${filtro==='tutti'?'active':''}" onclick="filtro='tutti';renderFiltri();renderClienti()">Tutti</button>`+
    `<button class="f-btn ${filtro==='urgenti'?'active':''}" onclick="filtro='urgenti';renderFiltri();renderClienti()">🔴 Urgenti</button>`+
    `<button class="f-btn ${filtro==='oggi'?'active':''}" onclick="filtro='oggi';renderFiltri();renderClienti()">Oggi</button>`+
    az.map(a=>`<button class="f-btn ${filtro===a?'active':''}" onclick="filtro='${a}';renderFiltri();renderClienti()">${a}</button>`).join('');
}

// ===== DETTAGLIO =====
function apriDettaglio(nome){
  const c=clienti.find(x=>x.nome===nome);if(!c)return;
  currentCliente=nome;
  document.getElementById('d-nome').textContent=c.nome;
  document.getElementById('d-info').textContent=`${c.zona} · ${c.mandanti.join(', ')}${c.contatti.referente?' · Rif. '+c.contatti.referente:''}`;
  const g=proxG(c),gm=gapMed(c),u=c.incontri?.length>0?c.incontri[c.incontri.length-1]:null,gg=u?daOggi(u.data):null;
  document.getElementById('d-metrics').innerHTML=
    `<div class="det-metric"><div class="mv">${c.incontri?.length||0}</div><div class="ml">Incontri</div></div>`+
    `<div class="det-metric"><div class="mv">${gm!==null?gm+'gg':'—'}</div><div class="ml">Gap medio</div></div>`+
    `<div class="det-metric"><div class="mv">${gg!==null?gg+'gg':'—'}</div><div class="ml">Dall'ultima</div></div>`+
    `<div class="det-metric"><div class="mv" style="color:${g!==null&&g<0?'var(--red)':g!==null&&g<=7?'var(--green)':'var(--txt)'}">${g!==null?lblStato(g):'—'}</div><div class="ml">Stato</div></div>`;
  if(c.incontri?.length>0){
    const s=[...c.incontri].sort((a,b)=>b.data.localeCompare(a.data));
    document.getElementById('tab-storico').innerHTML=s.map((inc,i)=>{
      const prox=i>0?s[i-1]:null, gp=prox?diffG(prox.data,inc.data):null;
      return `<div class="incontro-item"><div class="top"><span>${fData(inc.data)}</span>${gp!==null?`<span class="gap">${gp}gg dopo</span>`:''}</div>
        <div class="arg">${inc.argomenti}</div>${inc.decisioni&&inc.decisioni!=='—'?`<div class="dec">✅ ${inc.decisioni}</div>`:''}
        ${inc.prossimi_passi?`<div class="next">➡ ${inc.prossimi_passi}</div>`:''}</div>`;
    }).join('');
  } else document.getElementById('tab-storico').innerHTML='<div class="empty-state"><div class="emoji">📝</div><p>Nessun incontro</p></div>';
  document.getElementById('tab-info').innerHTML=`<div class="cliente-card" style="cursor:default"><div class="info" style="display:grid;gap:8px">
    <div><span style="color:var(--txt3);font-size:11px">Categoria</span><br><span>${c.categoria}</span></div>
    <div><span style="color:var(--txt3);font-size:11px">Zona</span><br><span>${c.zona}</span></div>
    <div><span style="color:var(--txt3);font-size:11px">Mandanti</span><br><span style="display:flex;gap:4px;margin-top:2px">${c.mandanti.map(m=>`<span class="badge badge-blu">${m}</span>`).join(' ')}</span></div>
    <div><span style="color:var(--txt3);font-size:11px">Referente</span><br><span>${c.contatti.referente||'—'}</span></div>
    <div><span style="color:var(--txt3);font-size:11px">Tel/Email</span><br><span>${c.contatti.telefono||'—'} · ${c.contatti.email||'—'}</span></div>
    <div><span style="color:var(--txt3);font-size:11px">Periodicità</span><br><span>${c.periodicita?'Ogni '+c.periodicita+'gg':'Da definire'}</span></div>
    ${c.prossimaVisita?`<div><span style="color:var(--txt3);font-size:11px">Prossima visita</span><br><span style="color:var(--green)">${fData(c.prossimaVisita)}</span></div>`:''}
  </div></div>`;
  document.getElementById('detail-view').classList.add('show');
  document.body.style.overflow='hidden';
}
function chiudiDettaglio(){document.getElementById('detail-view').classList.remove('show');document.body.style.overflow=''}
function switchTab(t){document.querySelectorAll('.det-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));document.querySelector(`.det-tab[onclick*="'${t}'"]`).classList.add('active');document.getElementById(`tab-${t}`).classList.add('active')}

// ===== MODALE INCONTRO =====
function apriNuovoIncontro(nome){
  currentCliente=nome;document.getElementById('mi-titolo').textContent=`📝 Nuovo incontro — ${nome}`;
  document.getElementById('f-data').value=new Date().toISOString().split('T')[0];
  ['f-ora','f-ora-fine','f-arg','f-dec','f-next','f-prox','f-rem'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('modal-incontro').classList.add('show');
}
function chiudiModale(){document.getElementById('modal-incontro').classList.remove('show')}
function salvaIncontro(){
  const c=clienti.find(x=>x.nome===currentCliente);if(!c)return;
  const inc={data:document.getElementById('f-data').value,ora:document.getElementById('f-ora').value,ora_fine:document.getElementById('f-ora-fine').value,argomenti:document.getElementById('f-arg').value,decisioni:document.getElementById('f-dec').value,prossimi_passi:document.getElementById('f-next').value,promemoria:document.getElementById('f-rem').value,stato:'aperto'};
  if(!c.incontri)c.incontri=[];c.incontri.push(inc);
  if(document.getElementById('f-prox').value)c.prossimaVisita=document.getElementById('f-prox').value;
  chiudiModale();renderKPI();renderClienti();renderMappa();
  if(document.getElementById('detail-view').classList.contains('show'))apriDettaglio(currentCliente);
  const m=document.createElement('div');m.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--emerald);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;z-index:999;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .3s';m.textContent='✅ Incontro registrato!';document.body.appendChild(m);setTimeout(()=>{m.style.opacity='0';setTimeout(()=>m.remove(),300)},2000);
}

// ===== MODALE CLIENTE =====
function apriNuovoCliente(){
  ['fc-nome','fc-ref','fc-tel','fc-email','fc-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fc-cat').value='rivendita';document.getElementById('fc-zona').value='Sicilia Ovest (Palermo)';document.getElementById('fc-per').value='30';
  document.getElementById('fc-mand').innerHTML=AZIENDE.map(a=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer"><input type="checkbox" value="${a}" style="width:14px;height:14px;accent-color:var(--accent)">${a}</label>`).join('');
  document.getElementById('modal-cliente').classList.add('show');
}
function chiudiModaleCliente(){document.getElementById('modal-cliente').classList.remove('show')}
function salvaNuovoCliente(){
  const n=document.getElementById('fc-nome').value.trim();if(!n){alert('Inserisci il nome');return}
  const m=[];document.querySelectorAll('#fc-mand input:checked').forEach(cb=>m.push(cb.value));
  const c={nome:n,categoria:document.getElementById('fc-cat').value,zona:document.getElementById('fc-zona').value,mandanti:m.length?m:['Altro'],contatti:{telefono:document.getElementById('fc-tel').value,email:document.getElementById('fc-email').value,referente:document.getElementById('fc-ref').value},incontri:[],periodicita:parseInt(document.getElementById('fc-per').value)||90,prossimaVisita:null,lat:null,lon:null};
  clienti.push(c);chiudiModaleCliente();renderKPI();renderFiltri();renderClienti();renderMappa();
  const msg=document.createElement('div');msg.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--emerald);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;z-index:999;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.5)';msg.textContent=`✅ "${n}" aggiunto!`;document.body.appendChild(msg);setTimeout(()=>msg.remove(),2500);
}

// ===== INIZIALIZZAZIONE =====
document.addEventListener('DOMContentLoaded',()=>{
  fetch('clienti_geo.json').then(r=>r.json()).then(d=>{if(d&&d.length)clienti=d}).catch(()=>{clienti=FALLBACK}).finally(()=>{
    renderKPI();renderFiltri();renderClienti();setTimeout(()=>renderMappa(),200);
  });
});
</script>
